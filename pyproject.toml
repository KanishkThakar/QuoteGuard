[project]
name = "quoteguard"
version = "1.0.0"
requires-python = ">=3.12,<3.14"
dependencies = ["Django>=5.2,<5.3", "djangorestframework>=3.17.2,<3.18", "psycopg[binary]>=3.2,<3.3", "redis>=6.4,<7", "requests>=2.32,<3", "gunicorn>=23,<24", "reportlab>=4.4,<5"]
[dependency-groups]
dev = ["pytest>=8.4,<9", "pytest-django>=4.11,<5", "pypdf>=6,<7"]
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["backend"]
testpaths = ["backend/tests"]
